<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Владислав Петровский</title>
  <desc id="d">Серверные системы, прикладной ИИ, сети</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17163A"/>
      <stop offset="1" stop-color="#2A2766"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A8CFF"/>
      <stop offset="1" stop-color="#3FB8AF"/>
    </linearGradient>
    <linearGradient id="tick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FB8AF"/>
      <stop offset="1" stop-color="#9A8CFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <clipPath id="clip"><rect width="1000" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    .name { font-family: 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif; font-size: 48px; fill: #EEEBFF; letter-spacing: .3px; }
    .tag  { font-family: system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size: 19px; fill: #BDB8EE; }
    .intro { animation: rise 1.4s ease-out both; }
    .pulse { animation: orbit 10s linear infinite; }
    @keyframes rise { from { opacity: 0; } to { opacity: 1; } }
    @keyframes orbit { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -603.2; } }
    @media (prefers-reduced-motion: reduce) { .intro, .pulse { animation: none; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <circle cx="860" cy="40" r="150" fill="#8B7CF6" opacity=".34" filter="url(#blur)"/>
    <circle cx="990" cy="320" r="130" fill="#3FB8AF" opacity=".30" filter="url(#blur)"/>
    <circle cx="90" cy="340" r="120" fill="#5B4FD6" opacity=".28" filter="url(#blur)"/>
  </g>
  <g fill="none">
    <circle cx="808" cy="160" r="142" stroke="#9A8CFF" stroke-opacity=".22" stroke-dasharray="2 9" stroke-linecap="round"/>
    <g stroke="#B7B0FF" stroke-opacity=".16" stroke-width="1"><line x1="808.0" y1="64.0" x2="875.9" y2="227.9"/><line x1="875.9" y1="92.1" x2="808.0" y2="256.0"/><line x1="904.0" y1="160.0" x2="740.1" y2="227.9"/><line x1="875.9" y1="227.9" x2="712.0" y2="160.0"/><line x1="808.0" y1="256.0" x2="740.1" y2="92.1"/><line x1="740.1" y1="227.9" x2="808.0" y2="64.0"/><line x1="712.0" y1="160.0" x2="875.9" y2="92.1"/><line x1="740.1" y1="92.1" x2="904.0" y2="160.0"/></g>
    <circle cx="808" cy="160" r="96" stroke="url(#ring)" stroke-opacity=".55" stroke-width="1.5"/>
    <circle class="pulse" cx="808" cy="160" r="96" stroke="#FFB86B" stroke-width="3.2" stroke-linecap="round"
            stroke-dasharray="58 545.2" transform="rotate(-90 808 160)"/>
  </g>
  <circle cx="808.0" cy="64.0" r="5.5" fill="#17163A" stroke="url(#ring)" stroke-width="2"/><circle cx="875.9" cy="92.1" r="4" fill="#17163A" stroke="url(#ring)" stroke-width="2"/><circle cx="904.0" cy="160.0" r="4" fill="#17163A" stroke="url(#ring)" stroke-width="2"/><circle cx="875.9" cy="227.9" r="4" fill="#17163A" stroke="url(#ring)" stroke-width="2"/><circle cx="808.0" cy="256.0" r="4" fill="#17163A" stroke="url(#ring)" stroke-width="2"/><circle cx="740.1" cy="227.9" r="4" fill="#17163A" stroke="url(#ring)" stroke-width="2"/><circle cx="712.0" cy="160.0" r="4" fill="#17163A" stroke="url(#ring)" stroke-width="2"/><circle cx="740.1" cy="92.1" r="4" fill="#17163A" stroke="url(#ring)" stroke-width="2"/>
  <g class="intro">
    <rect x="64" y="103" width="56" height="2" rx="1" fill="url(#tick)"/>
    <circle cx="64" cy="104" r="4" fill="#3FB8AF"/>
    <text class="name" x="62" y="164">Владислав Петровский</text>
    <text class="tag" x="64" y="204">Серверные системы, прикладной ИИ, сети</text>
  </g>
</svg>
