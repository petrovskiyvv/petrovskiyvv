<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Vladislav Petrovskiy" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7F5AF0"/>
      <stop offset="0.55" stop-color="#4361EE"/>
      <stop offset="1" stop-color="#2CB67D"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="260" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="url(#bg)"/>

    <circle cx="180" cy="40" r="110" fill="#ffffff" opacity="0.20" filter="url(#blur)">
      <animate attributeName="cx" values="180;430;180" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="240" r="140" fill="#2CB67D" opacity="0.55" filter="url(#blur)">
      <animate attributeName="cy" values="240;170;240" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="20" r="90" fill="#FF6B9D" opacity="0.38" filter="url(#blur)">
      <animate attributeName="cx" values="720;880;720" dur="18s" repeatCount="indefinite"/>
    </circle>

    <path fill="#ffffff" opacity="0.08">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="M0 215 C 200 175, 400 255, 600 215 S 1000 175, 1200 215 V260 H0 Z;
                M0 225 C 200 255, 400 185, 600 225 S 1000 255, 1200 225 V260 H0 Z;
                M0 215 C 200 175, 400 255, 600 215 S 1000 175, 1200 215 V260 H0 Z"/>
    </path>
    <path fill="#ffffff" opacity="0.06">
      <animate attributeName="d" dur="13s" repeatCount="indefinite"
        values="M0 235 C 250 205, 450 260, 700 235 S 1000 210, 1200 235 V260 H0 Z;
                M0 240 C 250 262, 450 215, 700 240 S 1000 262, 1200 240 V260 H0 Z;
                M0 235 C 250 205, 450 260, 700 235 S 1000 210, 1200 235 V260 H0 Z"/>
    </path>
  </g>

  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="118" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="0.5">Vladislav Petrovskiy</text>

    <text x="600" y="168" font-size="22" fill="#EEF3FF" opacity="0">
      Backend и LLM-приложения
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.04;0.29;0.33;1" values="0;1;1;0;0"/>
    </text>
    <text x="600" y="168" font-size="22" fill="#EEF3FF" opacity="0">
      Сети: MikroTik, Huawei, IS-IS
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.33;0.37;0.62;0.66;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="600" y="168" font-size="22" fill="#EEF3FF" opacity="0">
      Автоматизирую всё, что можно автоматизировать
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        keyTimes="0;0.66;0.70;0.95;1" values="0;0;1;1;0"/>
    </text>
  </g>
</svg>
